<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>AI Autopilot</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--acc:#0284c7;--accink:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#e2e8f0;--mute:#94a3b8;--line:#243047;--acc:#38bdf8;--accink:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Noto Sans Thai",sans-serif;padding-bottom:72px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:8px;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
button,.btn{text-decoration:none;display:inline-block;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5}
input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.s-todo{color:var(--mute)}.s-planning,.s-doing,.s-testing{color:var(--acc)}.s-done{color:var(--ok)}.s-blocked{color:var(--warn)}
.task{cursor:pointer}
.task h3{margin:0;font-size:16px}
.mute{color:var(--mute);font-size:14px}
.step{display:flex;gap:8px;padding:4px 0}
.log{border-left:3px solid var(--line);padding:4px 10px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.log.user{border-color:var(--acc)}.log.system{border-color:var(--warn)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;padding:8px 2px;background:none;font-size:12px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
nav button b{font-size:20px;font-weight:400;line-height:1}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;border:1px solid var(--line);cursor:pointer;font-size:14px}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.sev-high{color:var(--bad)}.sev-normal{color:var(--warn)}.sev-low{color:var(--mute)}
nav button.on{color:var(--acc);font-weight:600}
.day{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);cursor:pointer;user-select:none}
.day.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;display:none;z-index:10;max-width:90vw}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:var(--acc)}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>🤖 AI Autopilot</h1><span id="sync" class="mute"></span><button id="refresh" title="รีเฟรช">⟳</button></header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="tasks" class="on"><b>📋</b>งาน</button>
  <button data-tab="bugs"><b>🐞</b>บั๊ก</button>
  <button data-tab="chat"><b>💬</b>ถาม</button>
  <button data-tab="schedule"><b>⏰</b>เวลา/AI</button>
  <button data-tab="runs"><b>⚙️</b>สถานะ</button>
  <button data-tab="settings"><b>🔑</b>ตั้งค่า</button>
</nav>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LABEL = {todo:"รอทำ",planning:"กำลังวิเคราะห์",doing:"กำลังทำ",testing:"กำลังทดสอบ",done:"เสร็จแล้ว",blocked:"ต้องการคุณ"};
const DAYS = ["อา","จ","อ","พ","พฤ","ศ","ส"];
const MODELS = [
  ["sonnet", "Sonnet — สมดุล เก่งงานทั่วไปและเขียนโค้ด (แนะนำ)"],
  ["opus", "Opus — เก่งที่สุด งานยาก/ซับซ้อน ใช้โควตาเร็วกว่า"],
  ["haiku", "Haiku — เร็วและประหยัดโควตา งานง่าย"],
];
const modelName = m => m ? (MODELS.find(x => x[0] === m) || [m, m])[1].split(" — ")[0] : "";
const modelOpts = (sel, dflt) => `<option value="">${esc(dflt)}</option>` +
  MODELS.map(([v, l]) => `<option value="${v}" ${v === sel ? "selected" : ""}>${esc(l)}</option>`).join("");
const nowIso = () => new Date().toISOString().replace(/\.\d+Z$/, "Z");
const fmt = iso => iso ? new Date(iso).toLocaleString("th-TH", {dateStyle:"short", timeStyle:"short"}) : "";

let S = {}; try { S = JSON.parse(localStorage.getItem("ap-settings") || "{}"); } catch {}
let state = { tab: "tasks", tasks: null, config: null, open: null };

function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display="none",3000); }

// ---------- GitHub ----------
const b64e = s => { const b = new TextEncoder().encode(s); let r=""; for (let i=0;i<b.length;i+=0x8000) r+=String.fromCharCode(...b.subarray(i,i+0x8000)); return btoa(r); };
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")), c => c.charCodeAt(0)));
async function gh(path, opt = {}) {
  const r = await fetch(`https://api.github.com/repos/${S.owner}/${S.repo}${path}`, {
    ...opt, cache: "no-store",
    headers: { Authorization: `Bearer ${S.token}`, Accept: "application/vnd.github+json", ...(opt.headers||{}) }
  });
  if (!r.ok) { const e = new Error(`GitHub ${r.status}`); e.status = r.status; try { e.detail = (await r.json()).message; } catch {} throw e; }
  return r.status === 204 ? null : r.json();
}
async function getFile(name, dflt) {
  let j;
  try { j = await gh(`/contents/${name}?ref=${S.branch || "main"}`); }
  catch (e) { if (e.status === 404 && dflt) return { data: dflt(), sha: undefined }; throw e; }
  return { data: JSON.parse(b64d(j.content)), sha: j.sha };
}
// แก้ไฟล์แบบปลอดภัย: ดึงล่าสุด → แก้ → บันทึก ถ้าชนกับ AI ก็ลองใหม่
async function mutate(name, fn, msg, dflt) {
  for (let i = 0; i < 4; i++) {
    const { data, sha } = await getFile(name, dflt);
    fn(data);
    try {
      await gh(`/contents/${name}`, { method: "PUT", body: JSON.stringify({ message: msg, sha, branch: S.branch || "main",
        content: b64e(JSON.stringify(data, null, 2) + "\n") }) });
      return data;
    } catch (e) { if (e.status !== 409 && e.status !== 422) throw e; await new Promise(r => setTimeout(r, 800 * (i+1))); }
  }
  throw new Error("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง");
}

async function load(quiet) {
  if (!S.token) return render();
  $("#sync").textContent = "กำลังซิงค์…";
  try {
    const [t, c] = await Promise.all([getFile("tasks.json"), getFile("config.json")]);
    state.tasks = t.data.tasks.filter(x => !x.deleted); state.projects = t.data.projects || []; state.config = c.data;
    $("#sync").textContent = "ซิงค์ " + new Date().toLocaleTimeString("th-TH", {timeStyle:"short"});
  } catch (e) {
    $("#sync").textContent = "ซิงค์ไม่ได้";
    if (!quiet) toast(e.status === 401 ? "Token ไม่ถูกต้องหรือหมดอายุ" : e.status === 404 ? "ไม่พบ repo หรือไฟล์ — เช็กหน้าตั้งค่า" : "เชื่อมต่อไม่ได้: " + e.message);
  }
  render();
}

// ---------- Views ----------
function render() {
  if (state.pendingOpen && state.tasks) {        // เปิดงานจาก widget หลังโหลดรายการเสร็จ
    const t = state.tasks.find(t => t.id === state.pendingOpen);
    if (t) { state.pendingOpen = null; state.tab = t.kind === "bug" ? "bugs" : "tasks"; state.open = t.id; }
    else if (!state.pendingRetried) { state.pendingRetried = true; load(true); }   // งานเพิ่งเพิ่ม: โหลดรายการใหม่อีกครั้ง
    else state.pendingOpen = null;
  }
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  if (!S.token && state.tab !== "settings") state.tab = "settings";
  if (state.tab === "bugs" && state.open) {
    const t = state.tasks?.find(t => t.id === state.open);
    if (t) return vTask(t);
    state.open = null;                       // บั๊กถูกลบไปแล้ว กลับไปหน้ารายการบั๊ก
  }
  ({ tasks: vTasks, bugs: vBugs, chat: vChat, schedule: vSchedule, runs: vRuns, settings: vSettings })[state.tab]();
}

const projOf = t => t.project || t.id;
function projList() {
  const names = Object.fromEntries((state.projects || []).map(p => [p.id, p.name]));
  const ids = [...new Set([...(state.projects || []).map(p => p.id), ...(state.tasks || []).map(projOf)])]
    .filter(id => (state.tasks || []).some(t => projOf(t) === id) || (state.projects || []).some(p => p.id === id));
  const repos = Object.fromEntries((state.projects || []).filter(p => p.repo).map(p => [p.id, p]));
  return ids.map(id => ({ id, name: names[id] || (state.tasks.find(t => t.id === id) || {}).title || id, repo: repos[id]?.repo, branch: repos[id]?.branch }));
}
function loadApks(cb) {
  if (state.apks) return;
  state.apks = {};
  fetch(`https://api.github.com/repos/${S.owner}/${S.repo}/releases/tags/apps`, { cache: "no-store" })
    .then(r => r.ok ? r.json() : { assets: [] })
    .then(j => { j.assets.forEach(a => state.apks[a.name.replace(/\.apk$/, "")] = a.browser_download_url); cb && cb(); }).catch(() => {});
}
async function runProject(pid, btn) {
  btn && (btn.disabled = true);
  try { await gh(`/actions/workflows/autopilot.yml/dispatches`, { method: "POST", body: JSON.stringify({ ref: S.branch || "main", inputs: { force: true, project: pid } }) });
    toast("เริ่มทำโปรเจคนี้แล้ว (โปรเจคอื่นรอช่วงเวลาตามปกติ)"); }
  catch (e) { toast(e.status === 403 ? "Token ไม่มีสิทธิ์ Actions" : e.message); btn && (btn.disabled = false); }
}

function vTasks() {
  const v = $("#view");
  if (state.open) return vTask(state.tasks?.find(t => t.id === state.open));
  if (!state.tasks) { v.innerHTML = `<p class="mute">กำลังโหลด…</p>`; return; }
  loadApks(() => state.tab === "tasks" && !state.open && !typing() && vTasks());
  const order = {blocked:0,testing:1,doing:1,planning:1,todo:2,done:3};
  const projects = projList();
  const sel = state.newProj ?? (projects.length ? projects[0].id : "__new");
  const groups = projects.map(p => ({ ...p, tasks: state.tasks.filter(t => projOf(t) === p.id).sort((a,b) => (order[a.status]??2) - (order[b.status]??2)) }))
    .sort((a, b) => Math.min(...a.tasks.map(t => order[t.status]??2)) - Math.min(...b.tasks.map(t => order[t.status]??2)));
  const draft = { nt: $("#nt")?.value || "", nd: $("#nd")?.value || "", np: $("#np")?.value || "", nm: $("#nm")?.value || "" };
  v.innerHTML = `
    <div class="card">
      <label for="ps" style="margin-top:0">โปรเจค</label>
      <select id="ps">${projects.map(p => `<option value="${esc(p.id)}" ${p.id === sel ? "selected" : ""}>${p.repo ? "🐙" : "📁"} ${esc(p.name)}</option>`).join("")}
        <option value="__new" ${sel === "__new" ? "selected" : ""}>＋ สร้างโปรเจคใหม่</option></select>
      <div id="npw" class="${sel === "__new" ? "" : "hidden"}"><label for="np">ชื่อโปรเจคใหม่</label><input id="np" placeholder="เช่น แอปจดรายรับรายจ่าย"></div>
      <label for="nt">อยากให้ AI ทำอะไร</label>
      <input id="nt" placeholder="${sel === "__new" ? "เช่น ทำแอปจดรายรับรายจ่ายแบบง่าย" : "เช่น เพิ่มหน้ากราฟสรุปรายเดือน"}">
      <label for="nd">รายละเอียด (ไม่บังคับ)</label>
      <textarea id="nd" placeholder="เป้าหมาย ความต้องการ ข้อจำกัด ตัวอย่างที่ชอบ…"></textarea>
      <label for="nm">โมเดล AI</label>
      <select id="nm">${modelOpts(draft.nm, "ใช้โมเดลหลัก" + (state.config?.default_model ? ` (${modelName(state.config.default_model)})` : " (ค่าเริ่มต้น)"))}</select>
      <div class="row" style="margin-top:10px"><label class="row" style="margin:0;color:var(--ink)"><input type="checkbox" id="now" style="width:20px;height:20px"> ทำทันที</label>
        <span class="grow"></span><button class="primary" id="add">+ เพิ่มงาน</button></div>
    </div>
    ${groups.length ? "" : `<p class="mute">ยังไม่มีงาน เพิ่มงานแรกด้านบนได้เลย</p>`}
    <p class="mute" style="text-align:center"><a href="#" id="goimp">🐙 นำเข้าโปรเจคจาก GitHub repo ของคุณ</a></p>
    ${groups.map(g => { const left = g.tasks.filter(t => t.status !== "done").length; return `
      <div class="card" style="border-width:2px">
        <div class="row"><h3 class="grow" style="margin:0">${g.repo ? "🐙" : "📁"} ${esc(g.name)}</h3><span class="mute">${left ? `ค้าง ${left} งาน` : g.tasks.length ? "เสร็จหมดแล้ว" : "ยังไม่มีงาน"}</span></div>
        <div class="row" style="margin:8px 0">
          ${left ? `<button class="primary" data-runp="${esc(g.id)}">▶ ทำโปรเจคนี้เลย</button>` : ""}
          <button data-addp="${esc(g.id)}">＋ งาน</button>
          ${g.repo ? `<a class="btn" href="https://github.com/${esc(g.repo)}" target="_blank" rel="noopener">🐙 repo</a>`
            : `<a class="btn" href="https://${esc(S.owner)}.github.io/${esc(S.repo)}/workspace/${esc(g.id)}/" target="_blank" rel="noopener">🌐 เปิด</a>`}
          ${!g.repo && state.apks && state.apks[g.id] ? `<a class="btn" href="${esc(state.apks[g.id])}">📱 APK</a>` : ""}
        </div>
        ${g.tasks.map(t => { const n=(t.plan||[]).length, d=(t.plan||[]).filter(s=>s.done).length; return `
          <div class="task" data-id="${esc(t.id)}" style="border-top:1px solid var(--line);padding:10px 0 4px">
            <div class="row"><span class="grow">${t.kind === "bug" ? `<span class="sev-${esc(t.severity || "normal")}">🐞</span> ` : ""}${esc(t.title)}</span><span class="badge s-${esc(t.status)}">${LABEL[t.status]||esc(t.status)}</span></div>
            <div class="mute">${n ? `${d}/${n} ขั้นตอน · ` : ""}${t.model ? `🧠 ${esc(modelName(t.model))} · ` : state.config?.default_model ? `🧠 ${esc(modelName(state.config.default_model))} (หลัก) · ` : ""}อัปเดต ${fmt(t.updated)}</div>
            ${n && t.status !== "done" ? `<div class="progress"><i style="width:${Math.round(d/n*100)}%"></i></div>` : ""}
          </div>`; }).join("")}
      </div>`; }).join("")}`;
  $("#nt").value = draft.nt; $("#nd").value = draft.nd; $("#np").value = draft.np;
  if (state.focusTask) { state.focusTask = false; $("#nt").focus(); $("#nt").scrollIntoView({ block: "center" }); }
  $("#ps").onchange = e => { state.newProj = e.target.value; vTasks(); };
  $("#goimp").onclick = e => { e.preventDefault(); state.tab = "settings"; render(); setTimeout(() => $("#imp")?.scrollIntoView({ behavior: "smooth" }), 50); };
  document.querySelectorAll("[data-runp]").forEach(b => b.onclick = () => runProject(b.dataset.runp, b));
  document.querySelectorAll("[data-addp]").forEach(b => b.onclick = () => { state.newProj = b.dataset.addp; vTasks(); window.scrollTo(0, 0); $("#nt").focus(); });
  $("#add").onclick = async () => {
    const title = $("#nt").value.trim(); if (!title) return toast("ใส่สิ่งที่อยากให้ทำก่อน");
    const detail = $("#nd").value.trim(), runNow = $("#now").checked, model = $("#nm").value;
    let pid = $("#ps").value, pname = null;
    if (pid === "__new") { pname = $("#np").value.trim() || title; pid = "p" + Date.now().toString(36); }
    $("#add").disabled = true;
    try {
      const id = "t" + Date.now().toString(36);
      const d = await mutate("tasks.json", x => {
        x.projects ||= [];
        if (pname) x.projects.push({ id: pid, name: pname, created: nowIso() });
        x.tasks.push({ id, project: pid, title, detail, model, model_at: nowIso(), status: "todo", plan: [], log: [], created: nowIso(), updated: nowIso() });
      }, `app: เพิ่มงาน ${title}`);
      state.tasks = d.tasks.filter(x => !x.deleted); state.projects = d.projects || []; state.newProj = pid;
      $("#nt").value = ""; $("#nd").value = ""; $("#np").value = ""; $("#nm").value = "";
      if (runNow) await runProject(pid); else toast("เพิ่มงานแล้ว AI จะทำในช่วงเวลาที่ตั้งไว้");
    } catch (e) { toast(e.message); }
    render();
  };
  document.querySelectorAll(".task").forEach(el => el.onclick = () => { state.open = el.dataset.id; render(); });
}

function vTask(t) {
  const v = $("#view");
  if (!t) { state.open = null; return vTasks(); }
  const P = projList().find(p => p.id === projOf(t)) || {};
  v.innerHTML = `
    <button id="back">← กลับ</button>
    <div class="card" style="margin-top:12px">
      <div class="row"><h2 class="grow" style="margin:0;font-size:20px">${esc(t.title)}</h2><span class="badge s-${esc(t.status)}">${LABEL[t.status]||esc(t.status)}</span></div>
      ${t.kind === "bug" ? `<div class="sev-${esc(t.severity || "normal")}" style="font-size:14px">🐞 บั๊ก · ${esc((SEV.find(s => s[0] === (t.severity || "normal")) || SEV[1])[1].split(" — ")[0])}</div>` : ""}
      <div class="mute">${P.repo ? "🐙" : "📁"} ${esc(P.name || projOf(t))}${P.repo ? ` · <a href="https://github.com/${esc(P.repo)}" target="_blank" rel="noopener">${esc(P.repo)}</a>` : ""}</div>
      ${t.detail ? `<p style="white-space:pre-wrap">${esc(t.detail)}</p>` : ""}
      <label for="tm">🧠 โมเดล AI ของงานนี้</label>
      <select id="tm">${modelOpts(t.model || "", "ใช้โมเดลหลัก" + (state.config?.default_model ? ` (${modelName(state.config.default_model)})` : " (ค่าเริ่มต้น)"))}</select>
      ${P.repo ? `<div class="row">
      ${t.pr ? `<a class="btn primary" href="${esc(t.pr)}" target="_blank" rel="noopener">🔀 ดู Pull Request</a>` : ""}
      <a class="btn" href="https://github.com/${esc(P.repo)}/tree/ai-autopilot/${esc(t.id)}" target="_blank" rel="noopener">📁 ไฟล์ของงานนี้</a>
      <button id="askt">💬 ถามเกี่ยวกับโปรเจคนี้</button></div>
      <p class="mute">AI จะทำงานบน branch แยก แล้วเปิด Pull Request ให้คุณตรวจก่อน merge เข้า repo</p>` : `
      <div class="row"><a class="btn" href="https://${esc(S.owner)}.github.io/${esc(S.repo)}/workspace/${esc(projOf(t))}/" target="_blank" rel="noopener">🌐 เปิดดูผลงาน</a>
      <button id="askt">💬 ถามเกี่ยวกับโปรเจคนี้</button>
      ${(state.apks||{})[projOf(t)] ? `<a class="btn" href="${esc(state.apks[projOf(t)])}">📱 ดาวน์โหลด APK</a>` : ""}

const SEV = [["high", "🔴 ด่วน — ใช้งานไม่ได้/ข้อมูลผิด"], ["normal", "🟠 ปกติ — ใช้ได้แต่ผิดปกติ"], ["low", "⚪ เล็กน้อย — หน้าตา/คำผิด"]];
function vBugs() {
  const v = $("#view");

      <label for="be">ควรเป็นยังไง (ไม่บังคับ)</label><input id="be" placeholder="เช่น ข้อมูลควรยังอยู่หลังปิดแอป">

    <div class="row" style="margin-bottom:12px">${[["open", "ยังไม่แก้"], ["done", "แก้แล้ว"], ["all", "ทั้งหมด"]].map(([k, l]) => `<span class="chip ${f === k ? "on" : ""}" data-f="${k}">${l} ${cnt(k)}</span>`).join("")}</div>
    ${shown.length ? "" : `<p class="mute">${f === "open" ? "ไม่มีบั๊กค้าง 🎉" : "ยังไม่มีบั๊กในรายการนี้"}</p>`}
    ${groups.map(g => `<div class="card"><b>${esc(names[g] || g)}</b>
      ${shown.filter(t => projOf(t) === g).map(t => `

          <div class="row"><span class="grow"><span class="sev-${esc(t.severity || "normal")}">●</span> ${esc(t.title)}</span><span class="badge s-${esc(t.status)}">${t.status === "done" ? "แก้แล้ว" : LABEL[t.status] || esc(t.status)}</span></div>
          <div class="mute">${t.pr ? "🔀 มี PR · " : ""}แจ้ง ${fmt(t.created)}${t.status === "done" ? " · แก้เสร็จ " + fmt(t.updated) : ""}</div>
        </div>`).join("")}</div>`).join("")}`;
  $("#bt").value = d.bt; $("#bs").value = d.bs; $("#be").value = d.be;

        try { await gh(`/actions/workflows/autopilot.yml/dispatches`, { method: "POST", body: JSON.stringify({ ref: S.branch || "main", inputs: { force: true, task: id } }) });

    vChat(); window.scrollTo(0, document.body.scrollHeight);

      <label>Branch</label><input id="br" value="${esc(S.branch||"main")}" autocapitalize="off">
      <label>Personal access token</label><input id="tk" type="password" value="${esc(S.token||"")}" placeholder="github_pat_…">
      <div class="row" style="margin-top:12px"><button id="out" class="danger">ออกจากระบบ</button><span class="grow"></span><button class="primary" id="sv">บันทึกและเชื่อมต่อ</button></div>
    </div>
    ${S.token ? `<div class="card" id="imp"><b>🐙 นำเข้าโปรเจคจาก GitHub</b>
      <p class="mute">ดึงรายชื่อ repo ทั้งหมดในบัญชี GitHub ของคุณมาเป็นโปรเจคในแอป แล้วสั่งงาน AI ให้แก้โค้ดใน repo นั้นได้เลย AI จะทำบน branch แยกและเปิด Pull Request ให้คุณตรวจก่อน</p>
      <div id="repos"></div>
      <div class="row" style="margin-top:10px"><button id="ldr">${state.repos ? "↻ โหลดใหม่" : "🔗 เชื่อมต่อและโหลดรายชื่อ repo"}</button><span class="grow"></span>
        ${state.repos ? `<button id="all">เลือกทั้งหมด</button><button class="primary" id="doimp">นำเข้า</button>` : ""}</div>
      <details style="margin-top:10px"><summary class="mute">ต้องตั้งค่าอะไรบ้าง (ทำครั้งเดียว)</summary>
        <ol class="mute" style="padding-left:20px">
          <li>แก้ token ที่ <a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">GitHub → Fine-grained tokens</a> → Repository access เลือก <b>All repositories</b> และ Permissions เพิ่ม <b>Contents</b> กับ <b>Pull requests</b> เป็น Read and write (ถ้าเห็น repo ไม่ครบ แปลว่า token ยังเข้าถึงได้ไม่ทุก repo)</li>
          <li>ให้ AI บนคลาวด์เข้า repo อื่นได้: ไปที่ <a href="https://github.com/${esc(S.owner)}/${esc(S.repo)}/settings/secrets/actions/new" target="_blank" rel="noopener">หน้าเพิ่ม Secret</a> ตั้งชื่อ <b>GH_REPO_TOKEN</b> แล้ววาง token เดียวกัน</li>
        </ol></details>
    </div>` : ""}
    <p class="mute">📱 ดาวน์โหลดแอปทั้งหมดเป็นไฟล์ APK: <a href="https://github.com/${esc(S.owner||"")}/${esc(S.repo||"")}/releases/tag/apps" target="_blank" rel="noopener">หน้าดาวน์โหลด</a></p>
    <p class="mute">ติดตั้งเป็นแอป: บน Android เปิดใน Chrome → เมนู ⋮ → "เพิ่มลงในหน้าจอหลัก" / บนคอม กดไอคอนติดตั้งท้ายช่อง URL</p>`;
  $("#sv").onclick = async () => {
    S = { owner: $("#ow").value.trim(), repo: $("#rp").value.trim(), branch: $("#br").value.trim() || "main", token: $("#tk").value.trim() };
    try { localStorage.setItem("ap-settings", JSON.stringify(S)); } catch {}
    state.tab = "tasks"; await load();
  };
  if ($("#imp")) vImport();
  $("#out").onclick = () => { try { localStorage.removeItem("ap-settings"); } catch {} S = {}; state.tasks = state.config = null; render(); };
}

// ---------- นำเข้า repo จาก GitHub ----------
async function ghApi(path) {
  const r = await fetch("https://api.github.com" + path, { cache: "no-store", headers: { Authorization: `Bearer ${S.token}`, Accept: "application/vnd.github+json" } });
  if (!r.ok) { const e = new Error(`GitHub ${r.status}`); e.status = r.status; throw e; }
  return r.json();
}
async function listRepos() {
  const all = [];
  for (let page = 1; page <= 50; page++) {
    const r = await ghApi(`/user/repos?per_page=100&page=${page}&sort=updated&affiliation=owner,collaborator,organization_member`);
    all.push(...r); if (r.length < 100) break;
  }
  const self = `${S.owner}/${S.repo}`.toLowerCase();
  return all.filter(r => r.full_name.toLowerCase() !== self && !r.archived);
}
function repoSlug(name, taken) {
  const base = (name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30)) || "repo";
  let id = base, i = 2; while (taken.has(id)) id = `${base}-${i++}`;
  taken.add(id); return id;
}
function vImport() {
  const box = $("#repos"), have = new Set((state.projects || []).filter(p => p.repo).map(p => p.repo.toLowerCase()));
  state.repoSel ||= new Set();
  if (state.repos) {
    const fresh = state.repos.filter(r => !have.has(r.full_name.toLowerCase()));
    box.innerHTML = `<p class="mute">พบ ${state.repos.length} repo · นำเข้าแล้ว ${state.repos.length - fresh.length}</p>` +
      state.repos.map(r => { const done = have.has(r.full_name.toLowerCase()); return `
        <label class="row" style="margin:0;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);align-items:flex-start">
          <input type="checkbox" data-r="${esc(r.full_name)}" style="width:20px;height:20px;flex:none" ${done ? "checked disabled" : state.repoSel.has(r.full_name) ? "checked" : ""}>
          <span class="grow">${r.private ? "🔒 " : ""}<b>${esc(r.full_name)}</b>${done ? ` <span class="mute">· นำเข้าแล้ว</span>` : ""}
            ${r.description ? `<br><span class="mute">${esc(r.description)}</span>` : ""}</span></label>`; }).join("");
    box.querySelectorAll("[data-r]:not([disabled])").forEach(c => c.onchange = () => { c.checked ? state.repoSel.add(c.dataset.r) : state.repoSel.delete(c.dataset.r); });
    $("#all").onclick = () => { fresh.forEach(r => state.repoSel.add(r.full_name)); vImport(); };
    $("#doimp").onclick = async () => {
      const pick = state.repos.filter(r => state.repoSel.has(r.full_name) && !have.has(r.full_name.toLowerCase()));
      if (!pick.length) return toast("เลือก repo ที่ต้องการนำเข้าก่อน");
      $("#doimp").disabled = true;
      try {
        const d = await mutate("tasks.json", x => {
          x.projects ||= [];
          const exist = new Set(x.projects.filter(p => p.repo).map(p => p.repo.toLowerCase()));
          const taken = new Set([...x.projects.map(p => p.id), ...x.tasks.map(t => t.project || t.id)]);
          for (const r of pick) if (!exist.has(r.full_name.toLowerCase()))
            x.projects.push({ id: repoSlug(r.name, taken), name: r.name, repo: r.full_name, branch: r.default_branch || "main", private: !!r.private, created: nowIso() });
        }, `app: นำเข้า ${pick.length} repo จาก GitHub`);
        state.tasks = d.tasks.filter(x => !x.deleted); state.projects = d.projects || []; state.repoSel.clear();
        toast(`นำเข้า ${pick.length} โปรเจคแล้ว`);
      } catch (e) { toast(e.message); }
      vSettings();
    };
  }
  $("#ldr").onclick = async () => {
    $("#ldr").disabled = true; box.innerHTML = `<p class="mute">กำลังโหลดรายชื่อ repo…</p>`;
    try { state.repos = await listRepos(); }
    catch (e) { state.repos = null; box.innerHTML = `<p class="mute">❌ ${e.status === 401 ? "token ไม่ถูกต้องหรือหมดอายุ" : "โหลดไม่ได้: " + esc(e.message)}</p>`; $("#ldr").disabled = false; return; }
    vSettings();
  };
}

const typing = () => /INPUT|TEXTAREA/.test(document.activeElement?.tagName) && document.activeElement.value;
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.open = null; state.draft = null; render(); });
$("#refresh").onclick = () => { state.apks = null; load(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && !typing()) load(true); });
setInterval(() => { if (!document.hidden && (state.tab === "tasks" || state.tab === "bugs") && !typing()) load(true); }, 60000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// เปิดจาก widget/ทางลัดบนหน้าจอโฮม: #bugs / #newbug = แท็บ 🐞 (ฟอร์มจดบั๊ก), #tasks / #newtask = แท็บงาน (ฟอร์มเพิ่มฟีเจอร์), #open-<id> = เปิดงานนั้น
function fromHash() {
  let h = location.hash.slice(1); try { h = decodeURIComponent(h); } catch { return; }
  const m = h.match(/^open-(.+)$/);
  if (!m && !["bugs", "newbug", "tasks", "newtask"].includes(h)) return;
  history.replaceState(null, "", location.pathname + location.search);
  state.open = null; state.draft = null; state.pendingOpen = null; state.pendingRetried = false;
  if (m) { state.pendingOpen = m[1]; state.tab = state.tasks?.find(t => t.id === m[1])?.kind === "bug" ? "bugs" : "tasks"; }
  else if (h.endsWith("bug") || h === "bugs") { state.tab = "bugs"; state.bugFilter = "open"; state.focusBug = h === "newbug"; }
  else { state.tab = "tasks"; state.focusTask = h === "newtask"; }
  render();
}
window.addEventListener("hashchange", fromHash);
fromHash(); render(); load(true);
</script>
</body>
