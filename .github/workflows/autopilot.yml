name: AI Autopilot

on:
  schedule:
    - cron: "5 * * * *"      # ตื่นมาเช็กทุกชั่วโมง: ถ้าอยู่ในช่วงเวลาที่ตั้งไว้และมีงาน ก็ทำต่อ
  workflow_dispatch:         # ปุ่ม "รันเลยตอนนี้" ในแอป
    inputs:
      force:
        description: "รันทันทีโดยไม่สนช่วงเวลา"
        type: boolean
        default: false
      task:
        description: "ทำเฉพาะงาน id นี้ทันที (เว้นว่าง = ทุกงาน)"
        type: string
        default: ""
      project:
        description: "ทำเฉพาะโปรเจค id นี้ทันที (เว้นว่าง = ทุกโปรเจค)"
        type: string
        default: ""

concurrency:
  group: ai-autopilot-${{ inputs.project || inputs.task || 'all' }}   # แต่ละโปรเจครันพร้อมกันได้
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # ไม่เก็บ token ไว้ใน .git/config ที่ AI อ่านได้ (ตัวรันจะ push เองด้วย token จากไฟล์)
      - name: มีคำถามค้างอยู่ไหม (เช่นค้างเพราะติด limit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f chat.json ] && grep -q '"status": "pending"' chat.json; then gh workflow run ask.yml; fi
      - name: เช็กว่าต้องทำงานไหม
        id: check
        env:
          FORCE_RUN: ${{ inputs.force }}
          ONLY_TASK: ${{ inputs.task }}
          ONLY_PROJECT: ${{ inputs.project }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, "scripts")
          from run import window_minutes_left, next_task
          cfg = json.load(open("config.json"))
          force = os.environ.get("FORCE_RUN") == "true" or bool(os.environ.get("ONLY_TASK")) or bool(os.environ.get("ONLY_PROJECT"))
          ok = next_task() and (force or (cfg.get("enabled", True) and window_minutes_left(cfg) >= 5))
          print("go=" + ("yes" if ok else "no"))
          PY
      - uses: actions/setup-node@v4
        if: steps.check.outputs.go == 'yes'
        with: { node-version: 20 }
      - name: ติดตั้ง Claude Code
        if: steps.check.outputs.go == 'yes'
        run: npm install -g @anthropic-ai/claude-code
      - name: เตรียม token ให้ตัวรัน (ส่งเป็นไฟล์ ไม่ใส่ใน env ที่ AI มองเห็น)
        if: steps.check.outputs.go == 'yes'
        env:
          T_ROOT: ${{ github.token }}
          T_REPO: ${{ secrets.GH_REPO_TOKEN }}   # (ไม่บังคับ) ใช้กับโปรเจคที่นำเข้าจาก GitHub repo อื่น
        run: |
          umask 077
          printf '%s' "$T_ROOT" > "$RUNNER_TEMP/gh_token"
          printf '%s' "$T_REPO" > "$RUNNER_TEMP/repo_token"
      - name: ทำงานตามรายการ
        if: steps.check.outputs.go == 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORCE_RUN: ${{ inputs.force }}
          ONLY_TASK: ${{ inputs.task }}
          ONLY_PROJECT: ${{ inputs.project }}
        run: |
          export GH_TOKEN_FILE="$RUNNER_TEMP/gh_token" GH_REPO_TOKEN_FILE="$RUNNER_TEMP/repo_token"
          git config user.name "ai-autopilot"
          git config user.email "ai-autopilot@users.noreply.github.com"
          echo "BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 scripts/run.py
      - name: สั่ง build APK ของแอปที่มีการเปลี่ยนแปลง
        if: always() && steps.check.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}" && git checkout -q "origin/${GITHUB_REF_NAME}"
          apps=$(git diff --name-only "$BEFORE" HEAD -- workspace/ | cut -d/ -f2 | sort -u | while read a; do [ -f "workspace/$a/index.html" ] && echo "$a"; done | paste -sd, -)
          if [ -n "$apps" ]; then echo "build: $apps"; gh workflow run build-apk.yml -f apps="$apps"; else echo "ไม่มีแอปที่ต้อง build"; fi
