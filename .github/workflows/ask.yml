name: Ask AI

on:
  workflow_dispatch: {}     # แอปสั่งเมื่อมีคำถามใหม่

concurrency:
  group: ask-ai
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: มีคำถามค้างไหม
        id: check
        run: |
          python3 -c "import json,sys;d=json.load(open('chat.json')) if __import__('os').path.exists('chat.json') else {'messages':[]};print('go='+('yes' if any(m.get('status')=='pending' for m in d['messages']) else 'no'))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.go == 'yes'
        with: { node-version: 20 }
      - name: ติดตั้ง Claude Code
        if: steps.check.outputs.go == 'yes'
        run: npm install -g @anthropic-ai/claude-code
      - name: ตอบคำถาม
        if: steps.check.outputs.go == 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git config user.name "ai-autopilot"
          git config user.email "ai-autopilot@users.noreply.github.com"
          python3 scripts/ask.py
