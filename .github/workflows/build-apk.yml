name: Build APK

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "แอปที่จะ build (คั่นด้วย , เช่น autopilot,invest-app) หรือ all"
        default: "all"
  push:
    branches: [main]
    paths: ["docs/index.html", "docs/manifest.json", "android/**", "scripts/build_apk.sh"]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ inputs.apps || 'autopilot' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.p.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          REQ: ${{ inputs.apps || 'autopilot' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          req = os.environ["REQ"].strip()
          tasks = {t["id"]: t for t in json.load(open("tasks.json"))["tasks"]}
          avail = ["autopilot"] + sorted(p.parent.name for p in pathlib.Path("workspace").glob("*/index.html"))
          want = avail if req == "all" else [a.strip() for a in req.split(",") if a.strip() in avail]
          apps = []
          for a in want:
              if a == "autopilot":
                  apps.append({"id": "autopilot", "dir": "docs", "name": "AI Autopilot"}); continue
              meta = pathlib.Path(f"workspace/{a}/app.json")
              name = json.loads(meta.read_text()).get("name") if meta.exists() else None
              name = name or tasks.get(a, {}).get("title", a).split(":")[0][:30]
              apps.append({"id": a, "dir": f"workspace/{a}", "name": name})
          print("apps=" + json.dumps(apps, ensure_ascii=False))
          PY
      - name: เตรียมหน้าดาวน์โหลด
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release view apps >/dev/null 2>&1 || gh release create apps --title "📱 แอป Android (APK)" --notes "ไฟล์ APK ล่าสุดของทุกแอป อัปเดตอัตโนมัติ — ดาวน์โหลดบนมือถือแล้วกดติดตั้ง"

  build:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build ${{ matrix.app.id }}
        env:
          APP_ID: ${{ matrix.app.id }}
          APP_DIR: ${{ matrix.app.dir }}
          APP_NAME: ${{ matrix.app.name }}
        run: ./scripts/build_apk.sh "$APP_ID" "$APP_DIR" "$APP_NAME" "out/$APP_ID.apk"
      - name: อัปโหลด APK
        env:
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ matrix.app.id }}
        run: gh release upload apps "out/$APP_ID.apk" --clobber
